services:
  db:
    image: mariadb:11
    container_name: simqbit-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: simqbit
      MYSQL_USER: simqbit
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - simqbit_db:/var/lib/mysql
    networks: [simqbit]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    image: ghcr.io/android-sms-gateway/server:latest
    container_name: simqbit-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./configs/config.yml:/app/config.yml:ro
    ports:
      - "127.0.0.1:3900:3000"
    networks: [simqbit]
    dns:
      - 127.0.0.11
      - 1.1.1.1

networks:
  simqbit:
    driver: bridge

volumes:
  simqbit_db:
